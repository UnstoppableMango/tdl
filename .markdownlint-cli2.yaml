# Which files to lint. The workflow runs the action without a globs input
# so this is the only definition, and a bare `markdownlint-cli2` locally
# checks exactly what CI checks.
globs:
  - "**/*.{md,markdown}"

ignores:
  # Nix build cache, not ours.
  - ".direnv"
  # npm's install of editors/vscode's dependencies, not ours.
  - "**/node_modules"
  # Written by release-please. Linting a generated file means editing it
  # by hand, which the next release would overwrite.
  - "CHANGELOG.md"
  # A pointer at AGENTS.md rather than prose. A file whose whole content is
  # an import directive has no heading to lint.
  - "CLAUDE.md"
