# The only definition of which files to lint: CI passes no globs, so a bare
# `markdownlint-cli2` checks what CI checks.
globs:
  - "**/*.{md,markdown}"

ignores:
  - ".direnv"
  - "**/node_modules"
  # Written by release-please.
  - "CHANGELOG.md"
  # One import directive, with no heading to lint.
  - "CLAUDE.md"
