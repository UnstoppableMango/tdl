version = 1

# Generated files, committed because a consumer reads them without running
# the generator: ir.pb.go and plugin.pb.go come from buf, the tree-sitter
# parser from `tree-sitter generate`, and the TextMate grammar from
# internal/textmate. scanner.c is hand-written and stays in.
exclude_patterns = [
  "ir/ir.pb.go",
  "plugin/plugin.pb.go",
  "tree-sitter/src/grammar.json",
  "tree-sitter/src/node-types.json",
  "tree-sitter/src/parser.c",
  "tree-sitter/src/tree_sitter/**",
  "editors/vscode/syntaxes/**",
]

# The conformance corpus is input to the tests rather than source, and the
# playground files exist to be experimented with.
test_patterns = ["**/*_test.go", "testdata/**", "examples/**"]

[[analyzers]]
name = "go"
enabled = true

[analyzers.meta]
import_root = "github.com/unstoppablemango/tdl"

# tree-sitter/corpus.sh and editors/vscode/install.sh, the two files treefmt
# has no formatter for.
[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

# Reported from the Test job in .github/workflows/ci.yml, which writes
# cover.profile.
[[analyzers]]
name = "test-coverage"
enabled = true
