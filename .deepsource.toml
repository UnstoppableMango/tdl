version = 1

# Generated files. tree-sitter/src/scanner.c is hand-written and stays in.
exclude_patterns = [
  "ir/ir.pb.go",
  "plugin/plugin.pb.go",
  "tree-sitter/src/grammar.json",
  "tree-sitter/src/node-types.json",
  "tree-sitter/src/parser.c",
  "tree-sitter/src/tree_sitter/**",
  "editors/vscode/syntaxes/**",
]

# Test input and playground files, not source.
test_patterns = ["**/*_test.go", "testdata/**", "examples/**"]

[[analyzers]]
name = "go"
enabled = true

[analyzers.meta]
import_root = "github.com/unstoppablemango/tdl"

# tree-sitter/corpus.sh and editors/vscode/install.sh.
[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true

# Reported by the test job in .github/workflows/ci.yml.
[[analyzers]]
name = "test-coverage"
enabled = true
