[struct-kind]
spelling = "a `structure`"
notes = "An entity and a mixin both read back as a value."

[include]
spelling = "the mixin's members copied into the `structure`"
notes = "Reads back as members of the structure, without the include."

[enum]
spelling = "an `enum`"

[fielded-enum]
spelling = "a `union` of one `structure` per variant"
notes = "A variant without fields targets `Unit`."

[newtype]
spelling = "a named simple, `list`, or `map` shape"

[alias]
spelling = "expanded where used"

[optional]
spelling = "a member without `@required`"
notes = "A nullable value and a spelled-out `Option<T>` are written the same way, and read back as `T?`."

[collection]
spelling = "a named `list` or `map` shape"
notes = "A set is a `list` with `@uniqueItems`."

[min]
notes = "The `@range` trait is not written yet."

[max]
notes = "The `@range` trait is not written yet."

[length]
notes = "The `@length` trait is not written yet."

[matches]
notes = "The `@pattern` trait is not written yet."

[oneOf]
notes = "Validation is not generated."

[unique]
notes = "The `@uniqueItems` trait is written only for a set, not for a `unique` constraint."

[owned]
notes = "Smithy does not carry ownership, and the referenced structure is embedded by value."

[default]
notes = "The `@default` trait is not written yet."

[key]
notes = "The backend does not declare the directive, so it warns and is ignored."

[name]
spelling = "the member's written name"
notes = "The member reads back under the name it is written with, without the directive."

[number]
notes = "Smithy has no field numbers, and the backend does not declare the directive, so it warns and is ignored."

[doc]
spelling = "a `///` doc comment"

[generic]
notes = "Smithy has no generics, so `Page` is skipped, and so is every declaration naming it."

[class]
notes = "The class is not generated, and a conformance to it is dropped."

[unit]
notes = "The unit is dropped, and `decimal<kg>` is written as a `BigDecimal`."

[import]
notes = "Externs are not generated yet, so a declaration naming one is skipped."
