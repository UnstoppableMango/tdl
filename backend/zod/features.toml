[struct-kind]
spelling = "`z.object`"
notes = "Entities, values, and mixins are all objects; a `closed` directive makes one a `z.strictObject`."

[include]
spelling = "the mixin's properties, copied in"

[enum]
spelling = "`z.enum` of the variants' names"

[fielded-enum]
spelling = "a `z.discriminatedUnion` on `kind`"
notes = "A `discriminant` directive renames `kind`."

[newtype]
spelling = "a schema of its base, branded with its qualified name"
notes = "A `structural` directive writes no brands."

[alias]
spelling = "expanded where used"

[optional]
spelling = "`.exactOptional()` or `.nullable()`"

[collection]
spelling = "`z.array`, a uniqueness `refine`, and `z.record`"
notes = "A map keyed by a fieldless enum is a `z.partialRecord`."

[min]
spelling = "`.min(n)` on a number"
notes = "On a field, a schema of its own named for the struct and field; `min` and `max` together bounding at most 16 integers are a `z.literal` of each."

[max]
spelling = "`.max(n)` on a number"
notes = "On a field, a schema of its own named for the struct and field; `min` and `max` together bounding at most 16 integers are a `z.literal` of each."

[length]
spelling = "a `codePoints` refine on a string, `.min()` and `.max()` on a list, a `size` refine on a map"
notes = "A string counts code points, as TDL does, not Zod's UTF-16 units; a list's exact length of at most 16 is a `z.tuple`."

[matches]
spelling = "`.regex()` with a module constant printed from RE2's parse"
notes = "Checked only under a `patterns` directive, and never for a pattern a backtracking engine can take exponential time on."

[oneOf]
spelling = "`z.enum`, `z.literal`, or the enum's `.extract`"
notes = "Inferring the literal union `typescript` writes."

[unique]
spelling = "a `unique` refine on a list"

[owned]
notes = "Not written: a schema has no ownership, and a referenced entity is parsed by value."

[default]
spelling = "`.prefault(value)`"
notes = "Parsed through the schema, so a branded field takes a plain value; checked when generated too, so one the schema refuses warns and is not written rather than failing every parse."

[key]
notes = "The backend declares no `key` directive, since a schema has no identity."

[name]
spelling = "the property or schema name"
notes = "On a fielded variant it renames the variant's schema, never the `kind` value; on a variant of a fieldless enum it has no effect and warns."

[number]
notes = "JSON has no field numbers."

[doc]
spelling = "a JSDoc comment on the schema, its type, and each property"

[generic]
planned = "phase 5"

[class]
planned = "phase 5"

[unit]
planned = "phase 6"
notes = "Until then a quantity is its base type, with a warning."

[import]
spelling = "an `import` from the dependency's module"
notes = "Placed by both blocks' `out` directives, or named by a `foreign` directive."
