name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      - run: nix flake check
      - run: nix build .#

  treesitter:
    name: Tree-sitter
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      # Through the devShell rather than tree-sitter/setup-action: the
      # regeneration diff is only stable against a pinned CLI, and
      # flake.lock is what pins it.
      - run: nix develop --command make treesitter

      # The check the corpus cannot make. A production added to
      # docs/grammar.ebnf without regenerating is a diff here.
      - run: git diff --exit-code

      - run: nix develop --command make test-treesitter

  test:
    name: Test
    runs-on: thecluster
    permissions:
      contents: read
      # Codecov uploads with use_oidc: true
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod

      # -race is what catches a plugin subprocess writing its stderr
      # while the compiler reads it; nothing else in the suite does.
      - run: go test -race -coverprofile=cover.profile ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: cover.profile

  golangci-lint:
    name: golangci-lint
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  buf:
    name: Buf
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defaults do the right thing per event: lint, format, and breaking
      # change detection on a pull request, comparing against its base.
      # Nothing is published, so the push and archive steps stay off.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          push: false
          archive: false

  markdown-lint:
    name: Markdown Lint
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Which files to lint lives in .markdownlint-cli2.yaml, so a bare
      # `markdownlint-cli2` locally checks exactly what this checks.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
