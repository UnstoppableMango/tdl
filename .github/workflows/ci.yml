name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request supersedes the run before it.
# A push to main is grouped by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  # One job rather than a build and a test job: each job on a fresh runner
  # pays to fetch nixpkgs and evaluate the flake, and the checks and the
  # devShell share most of their closure (go, node, typescript, smithy).
  # The runner image ships Nix with the cluster's substituter configured.
  check:
    runs-on: thecluster
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-

      - run: nix flake check

      - run: nix build .#
        if: ${{ !cancelled() }}

      # The race detector and coverage run separately. Together, every
      # covered statement increments an atomic counter the race detector
      # tracks, which on the runner made the protocompile tests over ten
      # times slower and timed them out. The coverage run is -short: the
      # race run already ran go, smithy, tsc, and likec4 on generated code,
      # and test code is outside the coverage profile.
      - run: nix develop -c go test -race ./...
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"

      - id: test
        run: nix develop -c go test -short -coverpkg=./... -coverprofile=cover.profile ./...
        if: ${{ !cancelled() }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        continue-on-error: true
        with:
          use_oidc: true
          files: cover.profile

      - name: Upload coverage to DeepSource
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        continue-on-error: true
        run: |
          nix develop -c deepsource report \
            --analyzer test-coverage \
            --key go \
            --value-file cover.profile \
            --use-oidc

      - run: nix develop -c golangci-lint run ./...
        if: ${{ !cancelled() }}

      - run: nix develop -c make vscode-check
        if: ${{ !cancelled() }}

      # The treesitter shell is a subset of the default one realised above.
      - run: nix develop .#treesitter --command make check-treesitter
        if: ${{ !cancelled() }}

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        if: ${{ !cancelled() }}

  required:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
