name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  build:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check

      # The checks are not the package, so this builds what a consumer builds.
      - run: nix build .#

  test:
    runs-on: thecluster
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ github.job }}-

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c go test -race -coverprofile=cover.profile ./...
        env:
          CGO_ENABLED: '1'

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: cover.profile

      # The same profile, reported to the other consumer. The CLI reads the
      # job's OIDC token rather than a DSN secret, which is what the
      # id-token permission above is for, and it runs from the repository
      # root so the paths in the profile resolve.
      - name: Upload coverage to DeepSource
        run: |
          nix develop -c deepsource report \
            --analyzer test-coverage \
            --key go \
            --value-file cover.profile \
            --use-oidc

  lint:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ github.job }}-

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c golangci-lint run ./...

  buf:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          push: false
          archive: false

  markdown:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Which files to lint lives in .markdownlint-cli2.yaml, so a bare
      # `markdownlint-cli2` locally checks exactly what this checks.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  treesitter:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ github.job }}-

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop .#treesitter --command make check-treesitter
