name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request supersedes the run before it.
# A push to main is grouped by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  nix:
    uses: unmango/ci/.github/workflows/nix-ci.yml@30ae545a17dc3cd88663c8d0aa92ae374b62779c
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    with:
      darwin: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # One job rather than a build and a test job: each job on a fresh runner
  # pays to fetch nixpkgs and evaluate the flake, and the npm packages and
  # the devShell share most of their closure.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-

      # Before the build, which fails with NU1102 on the same drift and
      # names only the first package it cannot find.
      - name: dotnet/deps.json matches the projects
        run: |
          nix develop -c make dotnet-deps
          git diff --exit-code dotnet/deps.json

      # The npm packages windows-npm installs.
      - run: nix build .#npm -o result-npm
        if: ${{ !cancelled() }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: npm-windows
          path: |
            result-npm/unmango-tdl-[0-9]*.tgz
            result-npm/unmango-tdl-win32-*.tgz
          if-no-files-found: error
          retention-days: 1

      # Hercules builds every check: the race tests with every plugin and
      # tool (checks.go-test), golangci-lint, Biome, the tree-sitter
      # regeneration diff, markdownlint, and a second release build
      # (nix/gate.nix). This job uploads coverage, from the -short run checks.go-cover also
      # builds, since the shared Hercules jobs have no coverage effect.
      - id: test
        run: nix develop -c go test -short -coverpkg=./... -coverprofile=cover.profile ./...
        if: ${{ !cancelled() }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        continue-on-error: true
        with:
          use_oidc: true
          files: cover.profile

      - name: Upload coverage to DeepSource
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        continue-on-error: true
        run: |
          nix develop -c deepsource report \
            --analyzer test-coverage \
            --key go \
            --value-file cover.profile \
            --use-oidc

  # Nix does not run on Windows, so this job sets Go up from go.mod and
  # runs the suite -short, which skips the tools the check job runs on
  # generated code. .gitattributes checks every text file out with LF.
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go test -short ./...

  # The packed @unmango/tdl and this runner's platform package, from the check
  # job's Nix build, install with no registry and run, as they would from npm.
  windows-npm:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            cpu: x64
          - runner: windows-11-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-windows
          path: packages

      # A node built for the runner's own cpu, so process.arch names the
      # platform package this row installs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: ${{ matrix.cpu }}

      # The manifest names the two tarballs, so npm installs what it lists.
      - name: Install offline
        shell: bash
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          mkdir project && cd project
          tdl=$(echo ../packages/unmango-tdl-[0-9]*.tgz)
          platform=$(echo ../packages/unmango-tdl-win32-"$CPU"-*.tgz)
          node -e '
            const [tdl, platform, cpu] = process.argv.slice(1);
            const dependencies = { "@unmango/tdl": "file:" + tdl, ["@unmango/tdl-win32-" + cpu]: "file:" + platform };
            require("node:fs").writeFileSync("package.json", JSON.stringify({ name: "project", private: true, dependencies }));
          ' "$tdl" "$platform" "$CPU"
          npm install --offline --ignore-scripts --no-audit --no-fund

      # tdl.exe runs, finds tdl-gen-mermaid.exe on the PATH the shim puts
      # first, and the resolver finds tdl-gen-typescript.exe.
      - name: Run tdl and its plugins
        shell: bash
        working-directory: project
        run: |
          npx --offline tdl version
          printf 'package m\n\nprimitive string\n\ntype M {\n  id: string\n}\n\ntarget mermaid for m {}\n' > m.tdl
          npx --offline tdl gen --target mermaid -o out m.tdl
          grep -rq classDiagram out
          node -e '
            const { spawnSync } = require("node:child_process");
            const { binaryPath } = require("@unmango/tdl/resolve");
            const run = spawnSync(binaryPath("tdl-gen-typescript"), ["--help"], { encoding: "utf8" });
            if (!run.stderr.includes("usage: tdl-gen-typescript")) {
              console.error("tdl-gen-typescript did not run:", run.error ?? run.stderr);
              process.exit(1);
            }
          '

  required:
    needs: [nix, check, windows, windows-npm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
