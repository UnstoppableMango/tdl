name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request supersedes the run before it.
# A push to main is grouped by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  build:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check

      - run: nix build .#
        if: ${{ !cancelled() }}

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        if: ${{ !cancelled() }}

  test:
    runs-on: thecluster
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ github.job }}-

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c go test -race -coverprofile=cover.profile ./...
        env:
          CGO_ENABLED: "1"

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          use_oidc: true
          files: cover.profile

      - name: Upload coverage to DeepSource
        continue-on-error: true
        run: |
          nix develop -c deepsource report \
            --analyzer test-coverage \
            --key go \
            --value-file cover.profile \
            --use-oidc

      - run: nix develop -c golangci-lint run ./...
        if: ${{ !cancelled() }}

      - run: nix develop -c make vscode-check
        if: ${{ !cancelled() }}

      # The treesitter shell is a subset of the default one realised above.
      - run: nix develop .#treesitter --command make check-treesitter
        if: ${{ !cancelled() }}

  required:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
