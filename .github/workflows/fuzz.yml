name: Fuzz

# Weekly, and by hand, but never on a pull request or on Hercules: each
# target fuzzes for five minutes. A crasher fails the job and is uploaded;
# its fix commits it under the package's testdata/fuzz/ as a regression
# seed, which every go test then runs.
on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lex
            target: FuzzLex
          - package: parser
            target: FuzzParse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test "./$PACKAGE" -run '^$' -fuzz "^$TARGET\$" -fuzztime 5m

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: crashers-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
