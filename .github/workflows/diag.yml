name: diag

on:
  pull_request:

permissions:
  contents: read

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  diag:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-
      - name: machine
        run: |
          set -x
          uname -a; nproc; cat /proc/cpuinfo | grep -m3 -E "model name|flags" | cut -c1-300
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.stat 2>&1 || true
          free -m; ulimit -a
          cat /proc/sys/kernel/randomize_va_space /sys/kernel/mm/transparent_hugepage/enabled 2>&1 || true
          env | sort | grep -iE "^(GO|CGO|TSAN|NIX_|LD_)" || true
      - name: full test run, sampled
        env:
          CGO_ENABLED: "1"
        run: |
          nix develop -c true
          (
            while true; do
              echo "=== $(date +%T) cpu: $(grep -E 'usage_usec|nr_throttled|throttled_usec' /sys/fs/cgroup/cpu.stat | tr '\n' ' ')"
              echo "    mem.current=$(( $(cat /sys/fs/cgroup/memory.current) / 1048576 ))MB $(grep -E '^(anon|file|pgmajfault) ' /sys/fs/cgroup/memory.stat | tr '\n' ' ')"
              echo "    cpu.pressure: $(head -1 /sys/fs/cgroup/cpu.pressure)  mem.pressure: $(head -1 /sys/fs/cgroup/memory.pressure)"
              ps -eo pcpu,rss,nlwp,etimes,args --sort=-pcpu | head -12 | cut -c1-200
              sleep 15
            done
          ) &
          sampler=$!
          nix develop -c go test -race -coverpkg=./... -coverprofile=cover.profile ./... 2>&1 | grep -E '^(ok|FAIL|---|panic)|running tests|^\s+Test' || true
          kill $sampler
