name: diag

on:
  pull_request:

permissions:
  contents: read

env:
  GOMODCACHE: ${{ github.workspace }}/.go/mod
  GOCACHE: ${{ github.workspace }}/.go/build

jobs:
  diag:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .go
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-test-
      - name: machine
        run: |
          set -x
          uname -a; nproc; cat /proc/cpuinfo | grep -m3 -E "model name|flags" | cut -c1-300
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.stat 2>&1 || true
          free -m; ulimit -a
          cat /proc/sys/kernel/randomize_va_space /sys/kernel/mm/transparent_hugepage/enabled 2>&1 || true
          env | sort | grep -iE "^(GO|CGO|TSAN|NIX_|LD_)" || true
      - name: protobuf variants
        env:
          CGO_ENABLED: "1"
        run: |
          nix develop -c bash -c '
            set -x
            go test -race -count=1 -coverpkg=./... -coverprofile=/tmp/a.out ./backend/protobuf -run "TestConformance|TestRootFile" -v 2>&1 | grep -E "^(ok|FAIL|---)" | head -5
            go test -race -count=1 -coverprofile=/tmp/b.out ./backend/protobuf -run "TestConformance|TestRootFile" 2>&1 | tail -2
            go test -count=1 -coverpkg=./... -coverprofile=/tmp/c.out ./backend/protobuf -run "TestConformance|TestRootFile" 2>&1 | tail -2
            go test -race -count=1 -coverpkg=./... -c -o /tmp/pbcov ./backend/protobuf
            mkdir -p /tmp/gcd
            cd backend/protobuf
            time timeout 300 /tmp/pbcov -test.count=1 -test.run "TestConformance|TestRootFile" -test.gocoverdir=/tmp/gcd -test.coverprofile=/tmp/d.out -test.cpuprofile=/tmp/cpu.out | tail -2
            go tool pprof -top -cum -nodecount=45 /tmp/pbcov /tmp/cpu.out 2>&1 | cut -c1-220
          '
