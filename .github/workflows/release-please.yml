name: Release Please

on:
  push:
    branches: [main]

# Each job names its own: with two jobs, workflow-level write would reach both.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: unmango/actions/.github/workflows/release-please.yml@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The release assets, built by Nix from the tagged commit: one tarball per
  # platform and SHA256SUMS, uploaded to the release release-please just made
  # and attested, so `gh attestation verify` ties each file to this workflow.
  # A GitHub-hosted runner, so the provenance names no self-hosted machine.
  assets:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#release

      # The flake's version is release-please's, so the names carry the tag's.
      - name: The tarballs carry the release's version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: test -f "result/tdl_${VERSION}_linux_amd64.tar.gz"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: result/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG" result/* --repo "$GITHUB_REPOSITORY" --clobber
