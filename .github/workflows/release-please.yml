name: Release Please

on:
  push:
    branches: [main]

# Each job names its own: with two jobs, workflow-level write would reach both.
permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: unmango/actions/.github/workflows/release-please.yml@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The release assets, built by Nix from the tagged commit: one tarball per
  # platform and SHA256SUMS, uploaded to the release release-please just made
  # and attested, so `gh attestation verify` ties each file to this workflow.
  # A GitHub-hosted runner, so the provenance names no self-hosted machine.
  assets:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#release

      # The flake's version is release-please's, so the names carry the tag's.
      - name: The tarballs carry the release's version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: test -f "result/tdl_${VERSION}_linux_amd64.tar.gz"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: result/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG" result/* --repo "$GITHUB_REPOSITORY" --clobber

  # The six npm packages, packed by Nix from the tagged commit, published with
  # npm's trusted publishing: npm trusts this workflow's OIDC token in place of
  # a stored token, and writes provenance. Each package's trusted publisher on
  # npmjs.com names this file. The platform packages go first, so nothing
  # @unmango/tdl depends on is missing when it appears; a version already
  # published is skipped, so a rerun finishes what a failed run started.
  # Trusted publishing accepts only GitHub-hosted runners.
  npm:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: nix build .#npm

      - name: Publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          have=$(npm --version)
          [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -1)" = 11.5.1 ] || {
            echo "npm $have cannot publish through trusted publishing" >&2
            exit 1
          }

          cd result
          shopt -s nullglob
          platforms=(unmango-tdl-{linux,darwin}-*-"$VERSION".tgz)
          # After the platform packages, since @unmango/tdl names them.
          rest=("unmango-tdl-$VERSION.tgz" "unmango-tdl-typescript-$VERSION.tgz")
          [ ${#platforms[@]} = 4 ] && [ -f "${rest[0]}" ] && [ -f "${rest[1]}" ] || {
            echo "packages.npm does not hold six packages at $VERSION:" >&2
            ls >&2
            exit 1
          }

          # A prerelease, which release-please writes only under Release-As,
          # goes to next, so latest keeps the last stable release.
          tag=latest
          [[ $VERSION != *-* ]] || tag=next

          for tarball in "${platforms[@]}" "${rest[@]}"; do
            name=$(tar -xzOf "$tarball" package/package.json | jq -r .name)
            # Publish only on E404; any other failure to look the version up
            # stops the job rather than guessing.
            if view=$(npm view "$name@$VERSION" version 2>&1); then
              echo "$name@$VERSION is already published"
              continue
            elif [[ $view != *E404* ]]; then
              echo "$view" >&2
              exit 1
            fi
            # ./ so npm reads a file, never owner/repo shorthand for GitHub.
            npm publish "./$tarball" --access public --provenance --tag "$tag"
          done

  # The NuGet packages, packed by Nix from the tagged commit, pushed with
  # nuget.org's trusted publishing: NuGet/login trades this workflow's OIDC
  # token for an API key that lives an hour, so no key is stored. The policy
  # on nuget.org names this file, and vars.NUGET_USER is the account that
  # owns it. So far only Tdl.Gen.CSharp, the csharp plugin as a .NET tool;
  # the C# source generator (#1203) adds its package here. A version already
  # pushed is skipped, so a rerun finishes what a failed run started.
  nuget:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#tdl-gen-csharp-tool

      - name: The package carries the release's version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: test -f "result/Tdl.Gen.CSharp.$VERSION.nupkg"

      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # The runner's own dotnet pushes; any SDK can.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push result/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
