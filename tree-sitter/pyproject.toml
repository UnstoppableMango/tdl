[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-tdl"
description = "TDL grammar for tree-sitter, derived from docs/grammar.ebnf"
version = "0.1.3"
keywords = ["incremental", "parsing", "tree-sitter", "tdl"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Erik Rasmussen", email = "erik.rasmussen@unmango.dev" }]
requires-python = ">=3.10"
license.text = "MIT"

[project.urls]
Homepage = "https://github.com/unstoppablemango/tdl"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
