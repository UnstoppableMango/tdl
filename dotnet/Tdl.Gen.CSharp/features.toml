[struct-kind]
spelling = "a `sealed record`"
notes = "Entities, values, and mixins are all records."

[include]
spelling = "the mixin's properties, copied in"

[enum]
spelling = "a C# `enum`"

[fielded-enum]
spelling = "an `abstract record` with a nested `sealed record` per variant"
notes = "A private constructor closes it to its variants."

[newtype]
spelling = "a `readonly record struct`"

[alias]
spelling = "expanded where used"

[optional]
spelling = "a nullable property"
notes = "An optional `T?` may be left out, while a union with `null` is `required` and may be set to null."

[collection]
spelling = "`IImmutableList<T>`, `IImmutableSet<T>`, and `IImmutableDictionary<K, V>`"
notes = "A record holding one writes its own `Equals` and `GetHashCode`, since .NET compares collections by reference."

