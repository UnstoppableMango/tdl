// The TDL plugin protocol: the messages a backend exchanges with tdl,
// whether it is compiled in or run as a subprocess.
//
// See docs/design/plugins.md for the protocol.
edition = "2024";

package tdl.plugin.v1;

import "google/protobuf/go_features.proto";
import "tdl/ir/v1/ir.proto";

// Keep the open Go API these types were published with; backends
// construct them directly.
option features.(pb.go).api_level = API_OPEN;
// Implicit presence, as in proto3.
option features.field_presence = IMPLICIT;

// Handshake is what tdl sends first, before any request.
//
// A plugin that cannot read what is coming refuses here instead of
// ignoring fields it does not know and emitting wrong code.
message Handshake {
  // framing_version is the wire framing this connection uses. Version 1 is
  // a varint length prefix followed by an encoded message, in both
  // directions.
  int32 framing_version = 1;

  // ir_version is the protobuf package the model is encoded with, such as
  // "tdl.ir.v1". Within a version, field numbers are never reused and new
  // fields are additive.
  string ir_version = 2;

  // watch says this connection may serve more than one request.
  bool watch = 3;

  // mode says which requests follow: Request, or ImportRequest under
  // MODE_IMPORT.
  Mode mode = 4;
}

// Mode is the direction of a connection.
enum Mode {
  // MODE_UNSPECIFIED generates: it reads a model and writes the target
  // language. It is what a host sent before import mode existed.
  MODE_UNSPECIFIED = 0;
  // MODE_IMPORT reads the target language and writes a model. The host
  // sends it only to a plugin whose reply declared Features.reverse.
  MODE_IMPORT = 1;
}

// HandshakeReply is the plugin's answer.
message HandshakeReply {
  bool accepted = 1;

  // refusal says what the plugin needed, when accepted is false. It should
  // name both versions.
  string refusal = 2;

  string name = 3;
  string version = 4;

  // directives are what this backend understands. tdl checks the target
  // block against them before generating.
  repeated DirectiveSpec directives = 5;

  Features features = 6;

  // numbering is how this backend numbers fields and variants, for a wire
  // format that identifies them by number. tdl numbers every member and
  // reports a pin the rules refuse before generating. A backend that does
  // not number leaves it unset and receives no numbers.
  Numbering numbering = 7;
}

// Numbering is the rules a backend numbers members by. Numbers start at 1;
// a `number` directive pins one, and each other member, in declaration
// order, takes the lowest number no pin or earlier member holds and the
// rules allow.
message Numbering {
  // fields covers a structure's fields, a fielded enum's variants, and a
  // variant's fields.
  NumberRule fields = 1;
  // values covers the variants of an enum whose variants carry no fields.
  NumberRule values = 2;

  // reserve names a declaration directive whose integer arguments are
  // numbers the structure's fields may not take: allocation passes over
  // them, and a pin on one is refused. Its other arguments are ignored.
  string reserve = 3;

  // inline names a field directive that numbers the variants of the
  // field's enum in the field's own space, in place of the field.
  string inline = 4;
}

// NumberRule is what one number space allows.
message NumberRule {
  // max is the largest number.
  int64 max = 1;
  // reserved are inclusive ranges no member may take.
  repeated tdl.ir.v1.Range reserved = 2;
}

// DirectiveSpec is the shape of one directive a backend accepts.
//
// A directive in a target block that no spec declares is a warning and is
// passed through anyway.
message DirectiveSpec {
  string name = 1;
  int32 min_args = 2;

  // max_args is the largest number of arguments accepted, or -1 for any
  // number.
  int32 max_args = 3;

  // arg_kinds constrains each argument by position. An empty list accepts
  // any kind, and a list shorter than the argument count constrains only
  // the arguments it covers.
  repeated tdl.ir.v1.LiteralKind arg_kinds = 4;

  // repeatable says several entries of this directive at the same
  // specificity all reach the backend in source order. Otherwise they are
  // an error.
  bool repeatable = 5;

  // placements are where the directive may be written. An empty list
  // accepts it anywhere. A directive accepted on a declaration is also
  // accepted on an extern, which is a declaration another package owns.
  repeated Placement placements = 6;

  // values are what the first argument may be. An empty list accepts any
  // value.
  repeated string values = 7;
}

// Placement is a kind of node a directive lands on.
enum Placement {
  PLACEMENT_UNSPECIFIED = 0;

  // The target block itself.
  PLACEMENT_BLOCK = 1;
  PLACEMENT_DECL = 2;

  // A field of a declaration or of a variant.
  PLACEMENT_FIELD = 3;
  PLACEMENT_VARIANT = 4;
  PLACEMENT_EXTERN = 5;
}

// Features are the optional parts of the protocol a backend supports.
message Features {
  // reuse says the plugin can serve more than one request on a
  // connection. It must treat each as independent.
  bool reuse = 1;

  // reverse says the plugin answers MODE_IMPORT, reading its target
  // language back into a model.
  bool reverse = 2;
}

// Request is everything a backend needs for one generation. Nothing
// travels in argv or environment variables.
message Request {
  // target names the block being served. A backend keeps the directives
  // tagged with this name.
  string target = 1;

  // model is one package, with the prelude's declarations merged into it.
  tdl.ir.v1.Model model = 2;

  // out is the directory the response's paths are relative to.
  string out = 3;

  // dry_run says tdl will diff the response against disk rather than
  // write it. A backend may skip work that cannot affect the files; ignoring
  // the flag is correct.
  bool dry_run = 4;

  // analysis is what tdl derives from the model for this target, so a
  // plugin in any language reads it rather than computing it.
  Analysis analysis = 5;
}

// Analysis holds facts about a model that are the same for every backend
// serving one target: each type reference resolved to the prelude's shapes,
// and what each declaration names. See docs/design/plugin-sdk.md.
message Analysis {
  repeated TypeView types = 1; // indexed like Model.types
  repeated DeclView decls = 2; // indexed like Model.decls
}

// Form is which of the prelude's shapes a type resolves to. The shapes are
// matched by the prelude's spellings, as lowering matches them, so a
// replaced prelude reaches every plugin the same way.
enum Form {
  FORM_UNSPECIFIED = 0;
  // FORM_PRIMITIVE is a primitive that is not a collection; name says which.
  FORM_PRIMITIVE = 1;
  FORM_LIST = 2;
  FORM_SET = 3;
  // FORM_MAP has a key and a value; elem is the value.
  FORM_MAP = 4;
  // FORM_OPTION is `T?`.
  FORM_OPTION = 5;
  // FORM_NULLABLE is `T | null`.
  FORM_NULLABLE = 6;
  // FORM_NAMED is a declaration: a struct, an enum, a newtype, a class, or
  // a unit.
  FORM_NAMED = 7;
  // FORM_EXTERN is a declaration in another package.
  FORM_EXTERN = 8;
  // FORM_PARAM is a use of a type parameter; name is the parameter's.
  FORM_PARAM = 9;
  // FORM_UNIT is a unit of measure.
  FORM_UNIT = 10;
}

// TypeView is one entry of the type table, resolved.
//
// An entry whose constructor is an alias is described as the type the
// alias expands to, and id names that entry. elem and key are expanded the
// same way.
message TypeView {
  Form form = 1;

  // id is this entry after alias expansion: the entry itself unless its
  // constructor is an alias.
  tdl.ir.v1.ID id = 2;

  // name is the primitive's name, or the type parameter's.
  string name = 3;

  // elem is the element of a list or a set, the value of a map, and what
  // an option or a nullable wraps.
  tdl.ir.v1.ID elem = 4;
  // key is the key of a map.
  tdl.ir.v1.ID key = 5;

  // decl is the declaration, for FORM_NAMED; it indexes Model.decls.
  tdl.ir.v1.ID decl = 6;
  // extern indexes Model.externs, for FORM_EXTERN.
  tdl.ir.v1.ID extern = 7;

  // refusal is set when this type is one no schema backend writes. A
  // backend with generics or units reads the form and may ignore it. A
  // refusal of an element or a key is on that entry, not this one.
  Refusal refusal = 8;

  // references are the declarations this type names, through its
  // arguments, with aliases expanded, in the order they are first named.
  repeated tdl.ir.v1.ID references = 9;
}

// Refusal says why a type is one no schema backend writes. Each backend
// words the message, since some name the target language.
message Refusal {
  Reason reason = 1;

  // subject is the name the message is about: the declaration, the type
  // parameter, or the constructor that did not resolve.
  string subject = 2;

  tdl.ir.v1.Position position = 3;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    // REASON_UNRESOLVED is a constructor naming no declaration.
    REASON_UNRESOLVED = 1;
    // REASON_PARAM is a type parameter.
    REASON_PARAM = 2;
    // REASON_UNIT is a unit of measure used as a type.
    REASON_UNIT = 3;
    // REASON_CLASS is a class used as a type.
    REASON_CLASS = 4;
    // REASON_UNIT_DECL is a declared unit used as a type.
    REASON_UNIT_DECL = 5;
    // REASON_TYPE_ARGS is a declaration applied to type arguments.
    REASON_TYPE_ARGS = 6;
    // REASON_MISSING_ARG is a list, set, or map missing a type argument.
    // The arguments before it are still set.
    REASON_MISSING_ARG = 7;
  }
}

// DeclView is one entry of the declaration table, as one target sees it.
message DeclView {
  // own is false for a declaration the embedded prelude supplies.
  bool own = 1;

  // references are the declarations this one names through its fields,
  // its variants' fields, a newtype's base, an alias's target, and their
  // type arguments, with aliases expanded, in the order they are first
  // named. A declaration naming itself is included.
  repeated tdl.ir.v1.ID references = 2;

  // fielded is set on an enum with a variant carrying fields, making it a
  // sum type rather than a plain enum.
  bool fielded = 3;

  // discriminant is the property naming an enum's variant on the JSON
  // wire: the enum's `discriminant` directive, else the target block's,
  // else "kind".
  string discriminant = 4;

  // underlying is the type at the end of a newtype's chain of newtypes,
  // unset when the chain wraps itself or reaches a refused type.
  tdl.ir.v1.ID underlying = 5;

  // words are the last segment of the name split into the words a case
  // style joins: `userID` is user and ID, `HTTPServer` is HTTP and Server.
  repeated string words = 6;

  // fields are a structure's fields, in the order Structure.fields lists them.
  repeated MemberView fields = 7;
  // variants are an enum's variants, in the order Enum.variants lists them.
  repeated MemberView variants = 8;

  // constraints are a newtype's, in the order Newtype.value_constraints
  // lists them.
  repeated ConstraintView constraints = 9;
}

// MemberView is a field or a variant.
message MemberView {
  // words are the name split as DeclView.words splits it.
  repeated string words = 1;
  // fields are a variant's fields.
  repeated MemberView fields = 2;

  // number is the member's wire number under the backend's Numbering, or
  // 0 when the backend declares none. A field carrying the inline
  // directive takes no number.
  int64 number = 3;
  // inlined are the numbers of the variants an inlined field's enum
  // contributes to this space, in the order Enum.variants lists them.
  repeated int64 inlined = 4;

  // constraints are a field's, in the order Field.constraints lists them.
  repeated ConstraintView constraints = 5;
}

// ConstraintView is what tdl reads from one constraint.
message ConstraintView {
  // source is the constraint as TDL writes it: `length(1..64)`.
  string source = 1;

  // length is a `length` constraint's bounds, inclusive. An integer
  // argument is both ends, and a range leaves an open end unset. It is
  // unset when problem is.
  tdl.ir.v1.Range length = 2;

  // re2 is set on a `matches` constraint whose pattern RE2 reads, which a
  // target whose engine accepts every RE2 pattern with the same meaning
  // reads too. A pattern RE2 refuses may still suit a target with another
  // engine, so it is not a problem.
  bool re2 = 3;

  // problem says why tdl could not read the constraint, such as a length
  // that can never hold. tdl reports it as an error before generating.
  string problem = 4;
}

// Response is what a backend returns: file contents, which tdl writes, so
// tdl enforces path confinement, --verify, and --clean.
message Response {
  repeated File files = 1;

  // post names commands to run over the written files, by name only. The
  // project decides what a name maps to; a name it has not declared is
  // skipped with a warning.
  repeated string post = 2;

  repeated Diagnostic diagnostics = 3;
}

// File is one generated file, with a path relative to Request.out. An
// absolute path, or one containing "..", is an error and nothing is
// written.
message File {
  string path = 1;
  bytes content = 2;
}

// ImportRequest is everything a reverse backend needs to read one set of
// source files back into a model.
message ImportRequest {
  // target names the backend's language, as in Request.target. Directives
  // the backend writes into the model's target blocks name it.
  string target = 1;

  // files are the source files to read, with the paths the user gave.
  repeated File files = 2;

  // allow_lossy are the loss codes the user allowed. tdl drops warnings
  // carrying them, so a backend may skip the work of finding them; ignoring
  // the list is correct.
  repeated string allow_lossy = 3;
}

// ImportResponse is what a reverse backend returns: a model, which tdl
// turns into TDL source and lowers again before writing it.
message ImportResponse {
  // model holds the declarations read, in the shape lowering produces.
  // tdl prints only the declarations not positioned in the prelude.
  tdl.ir.v1.Model model = 1;

  repeated Diagnostic diagnostics = 2;
}

// Severity is how much a diagnostic matters.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
}

// Diagnostic is a problem a backend found.
//
// It carries a position rather than a node ID, because an ID alone does not
// say which table it indexes.
message Diagnostic {
  Severity severity = 1;
  string message = 2;
  tdl.ir.v1.Position position = 3;

  // code names the kind of problem, such as "lossy.collection". A warning
  // a user can silence carries one; see docs/design/reverse.md.
  string code = 4;
}
