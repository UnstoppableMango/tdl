[workspace]
members = ["tdl-plugin", "tdl-plugin-debug"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/UnstoppableMango/tdl"
# The crates are built from this repository and not published.
publish = false

[workspace.dependencies]
# Must match the protoc-gen-buffa nix/protoc-gen-buffa.nix builds, which
# writes tdl-plugin/src/generated.
buffa = "=0.9.2"
tdl-plugin = { path = "tdl-plugin" }
