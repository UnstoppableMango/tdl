version: v2

# go_package lives here rather than in each .proto.
#
# The overrides keep the short import paths these packages were published
# with, instead of the default tdl/ir/v1 under the module.
managed:
  enabled: true
  override:
    - file_option: go_package
      path: tdl/ir/v1/ir.proto
      value: github.com/unstoppablemango/tdl/ir
    - file_option: go_package
      path: tdl/plugin/v1/plugin.proto
      value: github.com/unstoppablemango/tdl/plugin

plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/unstoppablemango/tdl
