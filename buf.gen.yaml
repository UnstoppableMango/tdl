version: v2

# go_package lives here rather than in each .proto.
#
# The overrides keep the short import paths these packages were published
# with, instead of the default tdl/ir/v1 under the module.
managed:
  enabled: true
  override:
    - file_option: go_package
      path: tdl/ir/v1/ir.proto
      value: github.com/unstoppablemango/tdl/ir
    - file_option: go_package
      path: tdl/plugin/v1/plugin.proto
      value: github.com/unstoppablemango/tdl/plugin

plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/unstoppablemango/tdl
  # The .NET SDK's types, from protoc's own C# generator. Its version must
  # match the Google.Protobuf package dotnet/Tdl.Plugin references.
  - protoc_builtin: csharp
    out: dotnet/Tdl.Plugin/Generated
    opt: file_extension=.g.cs
    # The protos import go_features.proto for Go's options alone. Leaving its
    # package out strips those options, so the C# descriptors name neither it
    # nor descriptor.proto.
    exclude_types:
      - pb
